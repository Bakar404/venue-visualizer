[project]
name = "venue-visualizer-services"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic>=2.8",
  "python-multipart>=0.0.9",
  "pillow>=10.4",
  "pillow-heif>=0.18",
  "opencv-python-headless>=4.10",
  "scikit-image>=0.24",
  "numpy>=1.26",
  "jsonschema>=4.23",
  "reportlab>=4.2",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "datamodel-code-generator>=0.26"]

[project.optional-dependencies]
scene3d = ["playwright>=1.47"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["api", "pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
